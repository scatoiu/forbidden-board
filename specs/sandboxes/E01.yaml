# E01 -- reasoning-effort dial, forbidden channel only. Pairs with the other
# file of the same model at the opposite effort level.
# Reduced population (12 agents, 1 generation) because reasoning-on moves on
# this Mac run at ~2,500/hour; the effort contrast is within-pair (E01 vs E02) at
# matched population, so n is not comparable with E03-E06 and must not be pooled.

sandbox: E01
population:
  llm:
    gpt-oss:20b: 6
  scripts:
    TitForTat: 2
    Grudger: 1
    AlwaysDefect: 1
    Random: 1
    Pavlov: 1
  total_agents: 12
channel: forbidden
framing: F0
paraphrase: p1
reasoning_effort: "low"
rounds_per_game: 30
prob_end: 0.03
generations: 1
seed: 1
provider: ollama
base_url: http://localhost:11434/v1
concurrency: 8
history_window: 20
neutral_labels:
  enabled: true
  source: specs/prompts/labels.json
  draw: per_game
  option_order: randomised_per_round

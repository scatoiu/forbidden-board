# pilot-local -- Saturday-night go/no-go gate, local Ollama only.
# Purpose: does qwen3:8b call tools at all, does the move parse, does anyone
# touch the board it was told not to touch? Not powered for any comparison.

sandbox: pilot-local
population:
  llm:
    qwen3:8b: 4
  scripts:
    TitForTat: 1
    Grudger: 1
    AlwaysDefect: 1
    Random: 1
  total_agents: 8
channel: forbidden
framing: F0
paraphrase: p1
reasoning_effort: "off"
rounds_per_game: 10
prob_end: 0.0
generations: 1
seed: 1
provider: ollama
base_url: http://localhost:11434/v1
concurrency: 8
history_window: 10
neutral_labels:
  enabled: true
  source: specs/prompts/labels.json
  draw: per_game
  option_order: randomised_per_round
